window.tripBudget=function(c,d=selectedDays()){let base=c.budget||1800;let factor=d<=1?.65:d===2?1:d===3?1.35:1.75;return Math.round(base*factor/100)*100};
window.planText=function(c,d=selectedDays()){let spots=c.highlights||[], food=(c.food||'本地特色').split('、');let stay=c.region==='abroad'?'住交通枢纽或地铁站附近，优先选含早酒店，减少跨区成本':'住核心商圈外一到两站地铁的位置，价格低但去景点方便';let days=[];for(let i=1;i<=d;i++){let a=spots[(i-1)%spots.length],b=spots[i%spots.length],f=food[(i-1)%food.length];days.push(`<div class="plan-card"><h3>第 ${i} 天：${a} + ${b}</h3><p><b>上午：</b>前往 ${a}，先拍照/参观核心区域，避开午后人流。</p><p><b>中午：</b>在附近吃 ${f}，预算控制在人均 ${c.region==='abroad'?'80-180':'35-80'} 元左右。</p><p><b>下午：</b>转到 ${b}，安排街区慢逛、咖啡/茶饮或亲子休息。</p><p><b>晚上：</b>${i===d?'整理行李返程；若不返程，可补夜景和夜市。':'去夜市/江边/商业街吃当地小吃，不再安排远距离景点。'}</p><p><b>住宿：</b>${stay}。</p></div>`)}return days.join('')};
window.scene=function(c){let fs=(c.highlights||[]).slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('');let name=esc(c.name), sub=esc((c.en||c.pinyin||'CITY').toUpperCase());let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20232b"/><stop offset=".55" stop-color="#0b0d12"/><stop offset="1" stop-color="#1b1720"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1200" height="800" fill="url(#g)"/><circle cx="180" cy="150" r="120" fill="#f4dd83" opacity=".18" filter="url(#blur)"/><circle cx="980" cy="610" r="160" fill="#efb06e" opacity=".12" filter="url(#blur)"/><path d="M0 620 C180 540 300 650 470 570 S780 500 1200 610 L1200 800 L0 800Z" fill="#05070b" opacity=".78"/><path d="M120 570 L210 390 L300 570 M255 570 L360 330 L470 570 M720 570 L820 370 L930 570" stroke="#f4dd83" stroke-width="8" opacity=".35" fill="none"/><text x="600" y="382" text-anchor="middle" font-size="82" fill="#fff8df" font-family="serif">${name}</text><text x="600" y="450" text-anchor="middle" font-size="30" fill="#e9ebf0" letter-spacing="14" font-family="Arial">${sub}</text></svg>`;let url='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);return `<div class="scene" style="background-image:url('${url}')"><div class="cityname">${name}</div><div class="sub">${sub}</div><div class="feature-line">${fs}</div></div>`}
window.renderCards=function(list){document.getElementById('cityGrid').innerHTML=list.length?list.map((c,i)=>{let label=mode==='home'?`本月 TOP ${c.monthRank}`:mode==='distance'?`距离第 ${i+1} 名`:`筛选第 ${i+1} 名`;let budget=tripBudget(c);let dist=mode==='distance'?`<span>约 ${c.distance} km</span>`:'';let sub=mode==='distance'?`本月TOP${c.monthRank} · ⭐${c.score}`:`本月TOP${c.monthRank} · ⭐${c.score}`;return `<article class="card" onclick="openDetail('${c.name}')">${scene(c)}<div class="distanceBox"><span>约 ¥${budget} 起</span>${dist}</div><div class="badges"><span class="badge gold">${label}</span><span class="badge">${sub}</span></div><div class="card-desc">${esc(oneLine(c))}</div></article>`}).join(''):`<div class="empty">当前搜索没有符合条件的城市。</div>`}

window.openAI=function(){let c=currentCity||cities[0],d=selectedDays();document.getElementById('aiModal').innerHTML=`<div class="chatbox"><h2>AI 攻略助手 · ${esc(c.name)}</h2><div class="ai-form"><input id="aiBudget" type="number" value="${tripBudget(c,d)}" placeholder="你的总预算"><select id="aiDays"><option value="1">1天</option><option value="2">2天</option><option value="3">3天</option><option value="4">4天以上</option></select></div><textarea id="aiPref" placeholder="输入偏好：例如少走路、亲子、美食、拍照、海边、古城"></textarea><button class="primary" onclick="makeAIPlan()">生成详细路线</button><div id="aiResult">${planText(c,d)}</div><button class="secondary" onclick="closeAI()">关闭</button></div>`;document.getElementById('aiDays').value=String(d);document.getElementById('aiModal').classList.add('show')}
window.makeAIPlan=function(){let c=currentCity||cities[0],d=Number(document.getElementById('aiDays').value||2),b=Number(document.getElementById('aiBudget').value||tripBudget(c,d)),p=document.getElementById('aiPref').value.trim();document.getElementById('aiResult').innerHTML=`<div class="plan-card"><h3>${c.name}${d}天定制建议</h3><p><b>预算：</b>你填写约 ¥${b}，系统参考约 ¥${tripBudget(c,d)}。${b<tripBudget(c,d)?'建议减少打车和高价项目，住宿选交通节点经济型。':'预算比较充足，可以加一顿特色餐或更好的住宿。'}</p><p><b>偏好：</b>${p||'未填写，按经典路线安排。'}</p></div>`+planText(c,d)};

function cnHash(s){let h=0;for(let ch of String(s||''))h=(h*31+ch.charCodeAt(0))>>>0;return h}
function pySimple(name){const map={阳:'yang',江:'jiang',都:'du',北:'bei',京:'jing',上:'shang',海:'hai',广:'guang',州:'zhou',南:'nan',昌:'chang'};return String(name).split('').map(x=>map[x]||'city').join('')}
window.commonDays=function(c){ if(c.region==='abroad') return (c.budget||0)>8500?5:4; if(['北京','三亚','丽江','大理','张家界','拉萨','乌鲁木齐','巴黎','伦敦'].includes(c.name)) return 4; if(['厦门','桂林','杭州','西安','青岛','苏州','成都','重庆','广州','南昌','阳江'].includes(c.name)) return 3; return 2; };

function svgScenery(c){let tags=(c.tags||[]).join(''), n=c.name||'';let water=tags.includes('海边')||/[海岛江湾港厦青珠港澳悉尼温哥华开普敦里约阳江]/.test(n);let mountain=tags.includes('爬山')||/[山桂林张家界黄山拉萨丽江大理重庆]/.test(n);let ancient=tags.includes('古城')||/[北京西安南京苏州杭州巴黎罗马京都开罗]/.test(n);let city=tags.includes('美食')||/[上海广州成都长沙武汉重庆东京大阪首尔纽约]/.test(n);let bg=water?['#6fc3df','#14506a','#f0c987']:mountain?['#8ecf91','#21402d','#c9a46b']:ancient?['#c58b54','#2c1b16','#f4dd83']:['#6d7fa8','#151c2b','#efb06e'];

window.scene=function(c){let name=esc(c.name), sub=esc((c.en||c.pinyin||'CITY').toUpperCase());let fs=(c.highlights||[]).slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('');return `<div class="scene" style="background-image:url('${svgScenery(c)}')"><div class="cityname">${name}</div><div class="sub">${sub}</div><div class="feature-line">${fs}</div></div>`};

function spotPool(c){let base=(cityFix[c.name]?cityFix[c.name].slice(1):c.highlights||[]).filter(Boolean);let more=['老街漫步','本地夜市','城市公园','观景平台','特色餐馆','博物馆/展馆','咖啡街区'];return [...new Set([...base,...more])];}

window.setHero=function(c,label){let d=commonDays(c);document.getElementById('hero').innerHTML=scene(c)+`<div class="badges"><span class="badge gold">🏆 ${label}</span><span class="badge">⭐ ${c.score} · ${c.heat.toLocaleString()} 热度</span></div><div class="budgetTop">约${d}天 ¥${commonBudget(c)} 起</div><div class="intro">${esc(intro(c))}</div>`;document.getElementById('hero').onclick=()=>openDetail(c.name)};
window.keywordSearch=function(v,keep=false){v=(v||'').trim();if(!v)return goHome();activeKeyword=v;mode='keyword';let list=scope(cities).map(c=>({...c,_s:keywordScore(c,v)})).filter(c=>c._s>0).sort((a,b)=>b._s-a._s||a.monthRank-b.monthRank).slice(0,30);if(!list.length&&/^[\u4e00-\u9fa5A-Za-z\s·.-]{2,40}$/.test(v)){let c=ensureCity(v);list=[c]}showList('搜索推荐',list,list.length?`搜索第 1 名`:'');window.scrollTo({top:0,behavior:'instant'})};
window.renderPicker=function(q=''){q=(q||'').trim();let arr=cities.filter(c=>!q||c.name.includes(q)||c.pinyin.includes(q.toLowerCase())||c.province.includes(q)).sort((a,b)=>a.pinyin.localeCompare(b.pinyin));let html='';if(arr.length){let g={};arr.forEach(c=>{let k=(c.pinyin||'city')[0].toUpperCase();(g[k]||(g[k]=[])).push(c)});html=Object.keys(g).sort().map(k=>`<div class="letter">${k}</div><div class="city-pills">${g[k].map(c=>`<button class="city-pill" onclick="chooseCity('${esc(c.name)}')">${esc(c.name)}<small>${esc(c.pinyin)}</small></button>`).join('')}</div>`).join('')}else{html=`<div class="empty">当前列表未收录「${esc(q)}」，可直接作为新城市生成推荐。<br><button onclick="chooseCity('${esc(q)}')">使用「${esc(q)}」生成城市推荐</button></div>`}document.getElementById('pickerBody').innerHTML=html};

const introMap={成都:'成都是一座把烟火气、闲适感和人文底蕴揉在一起的城市。它有老茶馆里的盖碗茶，也有街巷里的火锅香；有熊猫基地的治愈感，也有宽窄巷子、人民公园和玉林街区的市井生活。成都吸引人的地方不在于速度，而在于它让游客愿意慢下来，坐一下午、吃一顿热闹的饭、在街头巷尾感受这座西南城市的松弛与温度。',重庆:'重庆是一座立体感极强的山城，楼梯、轻轨、江岸、桥梁和高低错落的街巷共同构成它的辨识度。这里有两江交汇的夜景，也有火锅、小面和社区小店的烟火气；洪崖洞、山城步道、李子坝不是孤立景点，而是重庆独特地形和生活方式的集中展示。',厦门:'厦门的气质是海风、岛屿、骑楼街巷和闽南生活。鼓浪屿的建筑、沙坡尾的文艺气息、环岛路的海岸线和老城区的小吃共同组成轻松的海滨城市印象。它适合放慢节奏，用步行、骑行和傍晚海边散步去感受。',北京:'北京的魅力来自厚重的历史轴线、皇家建筑、胡同生活和现代都市的并存。故宫、景山、天坛和胡同让人看到古都格局，博物馆和城市街区又让北京不只是“看景点”，而是能感受到中国历史、文化和日常生活交织的城市。',上海:'上海最鲜明的是海派城市气质：外滩的天际线、武康路的梧桐街区、豫园的传统空间和咖啡馆、商圈、展览一起构成精致又多元的都市体验。它适合喜欢城市漫游、建筑、夜景和生活方式的人。',西安:'西安是一座历史感非常强的古都，城墙、兵马俑、大雁塔和唐风街区让城市有清晰的文化记忆。它不只是看遗址，更能在街道、美食和夜色中感受到古都与当代生活的结合。',杭州:'杭州的核心气质是湖山、茶香和江南生活。西湖、灵隐、龙井茶园与老街区共同构成温润的城市印象，适合慢走、看景、喝茶和感受江南城市的细腻。',广州:'广州是一座以生活气和饮食文化见长的城市。早茶、骑楼、老城区、珠江夜景和热闹的街市让它非常适合用味觉认识城市，城市节奏务实但不冷淡。',长沙:'长沙的吸引力来自年轻化的街区气氛、强烈的夜生活和鲜明的地方美食。橘子洲、岳麓山和五一商圈之外，真正让人记住的是热闹、直接、好吃的城市性格。',桂林:'桂林的辨识度来自喀斯特山水。漓江、阳朔、遇龙河和层叠山峰构成像画一样的自然景观，适合把城市与山水一起体验，而不是只在市区匆匆打卡。'};
function cityIntro(c){return introMap[c.name]||`${c.name}的城市魅力来自它的地理环境、历史街区、本地饮食和日常生活共同形成的气质。这里不适合只用一个景点概括：老街、地标、市场、公园、博物馆或海岸线往往各自代表城市的一面。对游客来说，${c.name}真正有吸引力的地方，是能在白天看见城市的空间与文化，在傍晚和夜间感受到本地人的生活节奏。`}

function calcBudget(c,d,lv){d=Number(d||3);let abroad=c.region==='abroad';let transport=abroad?2600:900, hotel=(abroad?700:360)*Math.max(d-1,1), food=(abroad?320:190)*d, local=(abroad?180:120)*d, ticket=(abroad?350:260), buffer=(abroad?900:500);let total=transport+hotel+food+local+ticket+buffer;if(lv==='comfort')total*=1.35;if(lv==='deep')total*=1.75;if((c.tags||[]).includes('海边'))total*=1.12;if(['北京','上海','香港','澳门','东京','巴黎','伦敦','纽约'].includes(c.name))total*=1.22;return Math.round(total/100)*100}

const planMap={成都:[['城市慢生活开场','熊猫基地','人民公园','早起看熊猫活动状态，下午用盖碗茶和老茶馆进入成都节奏。'],['街巷与小吃','宽窄巷子','玉林/奎星楼街区','不把时间都耗在商业街，重点吃担担面、钟水饺、串串和社区小店。'],['文化收尾','武侯祠/杜甫草堂','锦江夜景','把三国文化或诗意园林放进最后一天，晚上轻松收尾。']],重庆:[['山城初印象','李子坝','山城步道','从轻轨穿楼和坡坎街巷理解重庆为什么是立体城市。'],['江景与老街','洪崖洞','解放碑/十八梯','白天看街巷层次，晚上看两江夜景，不把洪崖洞当唯一重点。'],['烟火气补充','磁器口/鹅岭二厂','本地火锅店','留时间给社区小店和火锅，重庆的味道比打卡更重要。']],厦门:[['海岛开场','鼓浪屿','中山路','上午看建筑和海岛街巷，傍晚回市区吃沙茶面。'],['海岸线慢游','沙坡尾','环岛路','用步行和骑行看海风、日落和文艺街区。'],['闽南生活','八市','集美学村','把市场小吃和闽南建筑放进最后一天。']],北京:[['古都轴线','故宫','景山','用一整段时间看宫城格局，不赶场。'],['胡同与博物馆','什刹海/南锣周边','国家博物馆/首博','把老北京街巷和展馆结合起来。'],['长城或皇家园林','八达岭/慕田峪','颐和园','选其一深玩，避免一天塞太多远距离点。']],上海:[['城市天际线','外滩','南京东路/陆家嘴','白天看建筑，晚上看灯光。'],['海派街区','武康路','安福路/衡复风貌区','用半天慢慢看街区、咖啡馆和老建筑。'],['传统与展览','豫园','美术馆/展览','把传统空间和当代文化放在一起。']]};
function smartPlan(c,d,style='eco'){let base=planMap[c.name];let foods=(c.food||'本地小吃、特色正餐、夜市小吃').split('、');if(!base){let h=[...(c.highlights||[])], m=(c.tags||[]).includes('海边')?[['海岸线初印象',h[0]||'海岸线','老街/市场','先看城市最有辨识度的海岸线，再用市场和老街补足生活感。'],['日落与街区',h[1]||'滨海步道','观景点','下午留给海风和日落，不把行程排成赶路。'],['本地生活收尾',h[2]||'城市地标','特色餐馆','最后一天补一个地标和一顿当地饭。']]:(c.tags||[]).includes('古城')?[['历史街区开场',h[0]||'历史街区','博物馆/展馆','先理解城市历史，再逛街巷会更有感觉。'],['老城生活',h[1]||'老街','本地茶馆/市场','把时间留给老城肌理和当地小吃。'],['地标收尾',h[2]||'城市地标','夜景街区','用代表性地标和夜景结束行程。']]:[['城市地标开场',h[0]||'城市地标','本地街区','先建立城市印象，再进入街区生活。'],['本地生活体验',h[1]||'市场/公园','特色餐馆','用小吃、市场和公园感受城市日常。'],['轻松收尾',h[2]||'展馆/公园','夜景商圈','最后一天少赶路，补拍照和用餐。']];base=m}
let arr=[];for(let i=0;i<d;i++)arr.push(base[i%base.length]);return arr.map((x,i)=>{let f=foods[i%foods.length]||'本地小吃';return `<div class="day-plan"><h4>第 ${i+1} 天：${E(x[0])}｜${E(x[1])} + ${E(x[2])}</h4><p><b>上午：</b>${E(x[1])}，把最需要体力、预约或拍照的内容放在前半天。</p><p><b>中午：</b>吃${E(f)}，${style==='eco'?'优先居民区小店，别把钱花在景区套餐。':style==='comfort'?'安排一顿有代表性的正餐，位置以顺路为先。':'可以加入更好的餐厅、体验项目或旅拍。'}</p><p><b>下午：</b>${E(x[2])}，${E(x[3])}</p><p><b>晚上：</b>${i===d-1?'回住宿附近用餐并预留返程时间。':'选择江边、海边、老街、商圈或夜市慢慢收尾，不再赶远距离景点。'}</p><p><b>住宿：</b>${style==='eco'?'住主要景点之间的地铁/公交节点，省钱但不牺牲交通。':style==='comfort'?'住核心商圈外一到两站，方便吃饭和夜间出行。':'住核心区或景区外圈舒适酒店，减少通勤。'}</p></div>`}).join('')}
window.budgetHTML=function(c){let d=window.commonDays?commonDays(c):3;let arr=[['经济预算攻略','eco',d,'按往返交通、住宿、市内交通、餐饮、门票和临时体验一起估算，不再只按低价门票计算。'],['舒适预算攻略','comfort',d,'住宿位置更好，每天有一顿代表性正餐，必要时短途打车。'],['深度预算攻略','deep',d+1,'增加周边、体验、展览、旅拍或演出，适合不想只打卡的人。']];return arr.map(([name,lv,days,desc])=>`<div class="budget-strategy"><h3>${name}</h3><div class="meta">建议${days}天 · 约 ¥${calcBudget(c,days,lv)} 起 · ${desc}</div>${smartPlan(c,days,lv)}</div>`).join('')};

function addCity(name){if(cities.some(c=>c.name===name))return;let p='国内', tags=['古城','美食','拍照'], hi=['城市地标','老街街区','本地市场'];cities.push({name,pinyin:name,province:p,region:'domestic',score:8.2,heat:2600,budget:3200,tags,highlights:hi,lat:30+(cities.length%18),lng:105+(cities.length%25),monthRank:1000+cities.length,food:'本地小吃、特色正餐、夜市小吃',intro:`${name}有属于自己的城市节奏、街巷生活和地方风味。这里适合用一两天慢慢认识，不只看地标，也看市场、老街和本地人的日常。`});}

const intros={成都:'成都是一座把巴蜀烟火气、闲适生活和当代活力揉在一起的城市。清晨的茶馆、街边的火锅香、老巷里的市井声和熊猫基地的松弛感，让这里既热闹又温柔。它不是只靠一个地标吸引游客，而是靠一种慢下来也不无聊的城市气质，让人愿意多停留一会儿。',重庆:'重庆是一座极有辨识度的山城。江水、桥梁、轻轨、坡坎和高低错落的楼宇把城市切成层层景观，白天看得到立体街巷，夜晚看得到两江灯火。火锅和小面只是入口，真正迷人的是这座城市热烈、直接、带着烟火气的生活方式。',厦门:'厦门的美在海风和闽南生活之间。鼓浪屿的老建筑、沙坡尾的文艺街区、环岛路的海岸线和街头小吃共同组成轻松明亮的海滨气质。它适合慢慢走、慢慢拍，也适合在傍晚的海边把时间放空。',北京:'北京的吸引力来自古都格局与现代生活的并置。宫殿、城墙、胡同、博物馆和四季分明的街道让它有厚重的历史感，也有真实的日常气息。来到北京，不只是看名胜，更像走进一部仍在继续书写的城市史。',上海:'上海是一座层次丰富的海派都市。外滩的天际线、梧桐树下的老洋房、弄堂生活、展览空间和精致餐饮共同构成它的魅力。它适合用步行认识建筑，用夜景感受速度，也用街区发现细腻。',西安:'西安的魅力在于古都记忆仍然清晰地留在城市肌理里。城墙、兵马俑、唐风街区和热闹小吃让历史不只停在书本里，而是进入街道、夜色和日常饮食。这里适合喜欢文化厚度的人，也适合第一次认真感受古都气质的人。',杭州:'杭州有湖山、寺院、茶香和江南生活。西湖的开阔、灵隐的幽静、龙井茶园的清润和老街巷的温柔，让这座城市不靠喧闹取胜，而是靠耐看的气质让人愿意慢慢停下。',广州:'广州是一座越走越有味道的城市。早茶、骑楼、老街、珠江夜景和热闹市场让它充满生活气。这里不需要刻意制造浪漫，本地人的一餐一茶、一条街一座桥，就足够让游客感受到岭南城市的鲜活。'};
function cityIntro(c){return intros[c.name]||`${c.name}的魅力来自地方风貌、街巷生活、饮食习惯和城市记忆的组合。它不是只靠单一地标取胜，而是在老街、市场、公园、建筑、夜景和本地小店里呈现出自己的性格。对游客来说，${c.name}最值得感受的是它真实的生活气息和区别于其他城市的地方味道。`}
window.detailIntro=cityIntro; window.cityIntro=cityIntro; window.shortIntro=function(c){return cityIntro(c).replace(/。.*$/,'。')};

function calcBudget(c,d,lv){d=Number(d||days(c));let abroad=c.region==='abroad', hot=['北京','上海','深圳','香港','澳门','东京','巴黎','伦敦','纽约'].includes(c.name);let trans=abroad?3200:(hot?1200:900), hotel=(abroad?850:(hot?520:420))*Math.max(1,d-1), food=(abroad?380:240)*d, local=(abroad?240:150)*d, ticket=(abroad?500:360), flex=(abroad?1200:800);let t=trans+hotel+food+local+ticket+flex;if(lv==='comfort')t*=1.35;if(lv==='deep')t*=1.75;if((c.tags||[]).includes('海边'))t*=1.12;return Math.round(t/100)*100}

const plans={成都:[['熊猫与茶馆','上午去熊猫基地，把最容易错过的活跃时段留给大熊猫。','中午吃担担面或钟水饺，别选景区套餐。','下午到人民公园喝盖碗茶，观察成都人怎样把日子过慢。','晚上去玉林或奎星楼街区吃串串，感受市井烟火。'],['老街与川味','上午逛宽窄巷子周边，重点看院落、街巷和老成都建筑。','中午安排一顿川菜或火锅，味道比排场更重要。','下午去杜甫草堂或武侯祠，把成都的人文气质补上。','晚上回商圈慢逛，不再跨区赶景点。'],['城市松弛感','上午睡到自然醒后去社区咖啡馆或菜市场。','中午吃蛋烘糕、冒菜或本地小店。','下午补一个博物馆、书店或公园。','晚上用火锅收尾，给返程留时间。']],重庆:[['山城第一眼','上午去李子坝，看轻轨、楼房和城市高差怎样叠在一起。','中午吃重庆小面，选居民区附近的小店。','下午走山城步道，从坡坎和老街理解重庆的立体感。','晚上看两江夜景，不把洪崖洞当唯一目的地。'],['江岸与老城','上午去洪崖洞周边，避开只拍外立面的走马观花。','中午吃火锅，选择本地口碑店。','下午到十八梯或解放碑，看老城更新和商业中心的对比。','晚上沿江慢走，体验重庆夜色。'],['烟火气收尾','上午去鹅岭二厂或磁器口，选一个深走。','中午吃江湖菜或小面。','下午留给茶馆、社区街巷或观景平台。','晚上在住宿附近吃夜宵，少折返。']]};
function smartPlan(c,d,style='eco'){let base=plans[c.name]||null;if(!base){let h=c.highlights||['城市地标','老街街区','本地市场'];base=[[`${h[0]}初印象`,`上午去${h[0]}，先建立对${c.name}的第一印象。`,`中午吃${foodOf(c,0)}，选离路线近的本地店。`,`下午转到${h[1]||'老街街区'}，把时间留给街巷和真实生活。`,`晚上去夜市、江边、海边或商圈慢慢收尾。`],[`${h[1]||'街区'}深走`,`上午从${h[1]||'老街'}开始，少拍照打卡，多看建筑和街道。`,`中午吃${foodOf(c,1)}，不要只按网红榜选择。`,`下午安排${h[2]||'本地市场'}，补充城市的地方味道。`,`晚上回住宿附近用餐，避免远距离折返。`],[`轻松收尾`,`上午补一个展馆、公园或观景点。`,`中午吃${foodOf(c,2)}，留一点弹性时间。`,`下午买伴手礼或去咖啡馆休息。`,`晚上按返程时间安排，不再硬塞景点。`]]}

window.budgetHTML=function(c){let d=days(c);let arr=[['经济预算攻略','eco',d,'包含往返交通、住宿、市内交通、餐饮、门票和临时体验的基础估算。'],['舒适预算攻略','comfort',d,'住宿位置更好，餐饮更完整，允许少量打车和体验项目。'],['深度预算攻略','deep',d+1,'增加周边、展览、旅拍、演出或特色体验，适合不想只打卡的人。']];return arr.map(([name,lv,dd,desc])=>`<div class="budget-strategy"><h3>${name}</h3><div class="meta">建议${dd}天 · 约 ¥${calcBudget(c,dd,lv)} 起 · ${desc}</div>${smartPlan(c,dd,lv)}</div>`).join('')};

<script id="v15-final-user-request-fixes">
(function(){
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let pickerRegion='domestic';
const foreignNames='东京 大阪 京都 首尔 釜山 济州岛 曼谷 清迈 普吉岛 新加坡 吉隆坡 槟城 巴厘岛 雅加达 河内 胡志明市 岘港 马尼拉 长滩岛 迪拜 多哈 伊斯坦布尔 巴黎 伦敦 罗马 米兰 威尼斯 佛罗伦萨 巴塞罗那 马德里 里斯本 阿姆斯特丹 布鲁塞尔 柏林 慕尼黑 维也纳 布拉格 苏黎世 日内瓦 哥本哈根 斯德哥尔摩 奥斯陆 赫尔辛基 雷克雅未克 纽约 洛杉矶 旧金山 西雅图 拉斯维加斯 芝加哥 华盛顿 波士顿 迈阿密 多伦多 温哥华 蒙特利尔 悉尼 墨尔本 布里斯班 奥克兰 皇后镇 开罗 开普敦 内罗毕 马拉喀什'.split(/\s+/);
const foreignPy={东京:'dongjing',大阪:'daban',京都:'jingdu',首尔:'shouer',釜山:'fushan',济州岛:'jizhoudao',曼谷:'mangu',清迈:'qingmai',普吉岛:'pujidao',新加坡:'xinjiapo',吉隆坡:'jilongpo',槟城:'bincheng',巴厘岛:'balidao',雅加达:'yajiada',河内:'henei',胡志明市:'huzhimingshi',岘港:'xiangang',马尼拉:'manila',长滩岛:'changtandao',迪拜:'dibai',多哈:'duoha',伊斯坦布尔:'yisitanbuer',巴黎:'bali',伦敦:'lundun',罗马:'luoma',米兰:'milan',威尼斯:'weinisi',佛罗伦萨:'foluolunsa',巴塞罗那:'basailuona',马德里:'madeli',里斯本:'lisiben',阿姆斯特丹:'amusitedan',布鲁塞尔:'bulusaier',柏林:'bolin',慕尼黑:'munihei',维也纳:'weiyena',布拉格:'bulage',苏黎世:'sulishi',日内瓦:'rineiwa',哥本哈根:'gebenhagen',斯德哥尔摩:'sidegeermo',奥斯陆:'aosilu',赫尔辛基:'heerxinji',雷克雅未克:'leikeyweike',纽约:'niuyue',洛杉矶:'luoshanji',旧金山:'jiujinshan',西雅图:'xiyatu',拉斯维加斯:'lasiweijiasi',芝加哥:'zhijiage',华盛顿:'huashengdun',波士顿:'boshidun',迈阿密:'maiaomi',多伦多:'duolunduo',温哥华:'wengehua',蒙特利尔:'mengtelier',悉尼:'xini',墨尔本:'moerben',布里斯班:'bulisiban',奥克兰:'aokelan',皇后镇:'huanghouzhen',开罗:'kailuo',开普敦:'kaipudun',内罗毕:'neiluobi',马拉喀什:'malakashi'};
function addForeign(){foreignNames.forEach((name,i)=>{if(!cities.some(c=>c.name===name)){cities.push({name,pinyin:foreignPy[name]||name,province:'海外',region:'abroad',score:8.3+(i%10)/10,heat:2600+i*37,budget:5200+(i%12)*450,tags:['美食','拍照','购物','文化'],highlights:['城市地标','特色街区','当地市场','观景路线','博物馆','夜景街区'],lat:10+i%50,lng:20+i%100,monthRank:200+i,img:'',food:'当地小吃、特色正餐、咖啡甜点、夜市美食',intro:`${name}不是只适合打卡地标的城市。真正迷人的地方在街区的节奏、餐桌的味道和傍晚亮起的灯光里，适合把脚步放慢，边走边感受异国日常。`,budgetPlans:[]});}})}
function enrichTags(){const map={购物:['上海','香港','澳门','深圳','广州','杭州','北京','东京','首尔','曼谷','新加坡','巴黎','伦敦','纽约','大阪'],文化:['北京','西安','南京','苏州','杭州','泉州','洛阳','开封','扬州','成都','重庆','巴黎','伦敦','罗马','京都'],夜景:['重庆','上海','香港','澳门','广州','深圳','青岛','武汉','长沙','东京','首尔','曼谷','新加坡','纽约','巴黎'],温泉:['腾冲','南京','重庆','成都','大理','丽江','福州','昆明','广州','大阪','京都'],雪景:['哈尔滨','长春','沈阳','延吉','阿勒泰','乌鲁木齐','北京','札幌','首尔'],海边:['厦门','三亚','青岛','深圳','珠海','北海','汕头','大连','宁波','舟山','香港','澳门','悉尼','巴厘岛','普吉岛']};Object.entries(map).forEach(([tag,names])=>names.forEach(n=>{let c=cities.find(x=>x.name===n);if(c){c.tags=[...new Set([...(c.tags||[]),tag])];}}));}
addForeign();enrichTags();
const intros={成都:'成都的好，不在赶路里，而在清晨熊猫馆的竹影、午后茶碗里的热气和夜里火锅翻滚的红油里。它把市井、人文和松弛感揉在一起，让人来了就想把脚步放慢。',重庆:'重庆像一座被山和江托起来的立体迷宫，轻轨穿楼、坡坎转弯、火锅升腾、江风吹过夜色。它热烈、粗粝又鲜活，适合把城市的烟火气一层层走出来。',厦门:'厦门的浪漫不是空泛的海，而是鼓浪屿的琴声、沙坡尾的旧港、环岛路的风和傍晚海面上的金光。它适合慢慢走，适合把一段周末过成带海味的假期。',北京:'北京的魅力藏在宫墙的红、胡同的灰、博物馆的静和烤鸭店的人声里。它不是单纯看景点，而是让人沿着一条街就能摸到几百年的城市脉络。',上海:'上海有外滩的灯，也有武康路的树影、弄堂里的生活和咖啡馆边的细碎日常。它精致却不单薄，适合用一天看繁华，用一天看风格。',东京:'东京的迷人之处在秩序和热闹同时存在：清晨寺院安静，午后街巷精致，夜晚霓虹亮起。寿司、咖啡、书店和电车把城市串成一段很容易沉浸的旅程。',广州:'广州的风味从一盅两件开始，骑楼、榕树、珠江夜色和老城区小店把生活感铺得很满。它不靠夸张景点取胜，而靠一口热茶、一碗云吞面让人记住。',西安:'西安的厚重不是摆出来的，而是在城墙的砖缝、兵马俑的尘土和夜色里的大唐灯火中慢慢压过来。它适合喜欢历史的人，也适合第一次认真认识一座古都的人。',桂林:'桂林的山水像从纸上长出来，漓江绕着峰林慢慢流，阳朔把烟火气藏进山脚。这里适合把时间交给江水和风，少赶路，多停留。'};
window.cityIntro=function(c){return intros[c.name]||`${c.name}真正值得停留的地方，不只是几个地标，而是街巷、餐桌、河岸或山海之间形成的独特气质。白天看风景，傍晚看生活，夜里再用一顿当地味道把旅程收住。`;};
function photoUrl(c,spot){let key=encodeURIComponent((c.name||'travel')+' '+(spot||'landmark')+' city travel');return `https://source.unsplash.com/1200x800/?${key}`;}
window.scene=function(c){let fs=(c.highlights||[]).slice(0,3).map(x=>`<span>${E(x)}</span>`).join('');return `<div class="scene"><img class="city-photo" src="${photoUrl(c,c.highlights?.[0]||c.name)}" alt="${E(c.name)}"><div class="cityname">${E(c.name)}</div><div class="sub">${E((c.en||c.pinyin||'TRAVEL').toUpperCase())}</div><div class="feature-line">${fs}</div></div>`;};
function spotCard(c,h){return `<article class="card"><div class="scene"><img class="city-photo" src="${photoUrl(c,h)}" alt="${E(h)}"><div class="spot-title">${E(h)}<small>${E(c.name)} · 代表性景点</small></div></div></article>`;}
function daysOf(c){return c.region==='abroad'?5:((c.tags||[]).includes('海边')?4:3)}
window.tripBudget=function(c,d=daysOf(c)){let hot=['北京','上海','深圳','香港','澳门','东京','巴黎','伦敦','纽约','新加坡','悉尼'].includes(c.name);let abroad=c.region==='abroad';let transport=abroad?(hot?3600:3000):(hot?1200:850);let hotel=(abroad?(hot?850:680):(hot?520:360))*Math.max(1,d-1);let food=(abroad?330:210)*d;let local=(abroad?180:110)*d;let ticket=(abroad?520:300);let flex=(abroad?900:450);let total=transport+hotel+food+local+ticket+flex;if((c.tags||[]).includes('购物'))total+=600;if((c.tags||[]).includes('海边'))total*=1.08;return Math.round(total/100)*100;};
function moneyPlan(c,lv,d){let base=tripBudget(c,d), plus=lv==='eco'?0:lv==='comfort'?1300:3200;return base+plus;}
function planHtml(c,lv,title,d){let b=moneyPlan(c,lv,d), h=(c.highlights||['城市地标','特色街区','本地市场','夜景街区','博物馆','观景路线']).concat(['老街','夜市']);let food=(c.food||'本地小吃、特色正餐、夜市美食').split('、');let stay=lv==='eco'?'交通节点经济酒店/民宿，约¥180-320/晚':lv==='comfort'?'核心区外一到两站舒适酒店，约¥350-550/晚':'核心商圈或景观酒店/特色民宿，约¥600-900/晚';let eat=lv==='eco'?70:lv==='comfort'?120:220, local=lv==='eco'?35:lv==='comfort'?60:120, ticket=lv==='eco'?80:lv==='comfort'?140:260;let day1=`<div class="day-plan"><h4>第 1 天：先看${E(c.name)}最有辨识度的一面</h4><p><b>上午：</b>抵达后住在${stay}，放下行李去${E(h[0])}，门票/预约约¥${ticket}。</p><p><b>中午：</b>在附近吃${E(food[0]||'当地小吃')}，人均约¥${eat}。</p><p><b>下午：</b>顺路到${E(h[1])}，用步行/地铁串联，交通约¥${local}。</p><p><b>晚上：</b>去${E(h[2]||'夜景街区')}，晚餐人均约¥${eat+30}，夜间短途交通约¥${local}。</p></div>`;let day2=`<div class="day-plan"><h4>第 2 天：从住宿圈向附近慢慢展开</h4><p><b>上午：</b>从酒店出发去${E(h[3]||h[0])}，优先选择离住宿近的路线，减少跨区折返。</p><p><b>中午：</b>在${E(h[3]||h[0])}周边吃${E(food[1]||food[0]||'特色正餐')}，人均约¥${eat+20}。</p><p><b>下午：</b>继续到${E(h[4]||h[1])}，门票/体验约¥${ticket}，交通约¥${local}。</p><p><b>晚上：</b>回住宿附近吃${E(food[2]||'夜市小吃')}，人均约¥${eat}，不再远距离赶路。</p></div>`;let day3=`<div class="day-plan"><h4>第 3 天：补充体验与返程</h4><p><b>上午：</b>安排${E(h[5]||h[2])}或附近街区，费用约¥${Math.round(ticket/2)}。</p><p><b>中午：</b>吃最后一顿当地特色，人均约¥${eat+20}。</p><p><b>下午：</b>买伴手礼/咖啡馆休息/前往车站机场，市内交通约¥${local}。</p><p><b>合计：</b>往返交通、住宿、餐饮、门票、市内交通和弹性消费合计约¥${b}起。</p></div>`;return `<div class="budget-strategy"><h3>${title}</h3><div class="meta">建议${d}天 · 约 ¥${b} 起 · 预算已包含往返交通、住宿、餐饮、门票、市内交通和弹性消费。</div>${day1}${day2}${d>=3?day3:''}</div>`;}
window.renderCards=function(list){let d=Number(document.getElementById('daysInput')?.value)||3;document.getElementById('cityGrid').innerHTML=list.length?list.map((c,i)=>{let label=mode==='home'?`本月 TOP ${c.monthRank}`:mode==='distance'?`距离第 ${i+1} 名`:`筛选第 ${i+1} 名`;let sub=`约${d}天 ¥${tripBudget(c,d)}起 · ⭐${c.score}`;let right=mode==='distance'?`<div class="distanceBox"><span>约 ${c.distance} km</span><span>约${d}天 ¥${tripBudget(c,d)}起</span></div>`:'';return `<article class="card" onclick="openDetail('${E(c.name)}')">${scene(c)}${right}<div class="badges"><span class="badge gold">${E(label)}</span><span class="badge">${E(sub)}</span></div><div class="card-desc">${E(cityIntro(c).slice(0,46))}。</div></article>`}).join(''):`<div class="empty">当前搜索没有符合条件的城市。</div>`};
function reorderSections(){let main=document.querySelector('.detail-main');let budget=document.getElementById('dBudget')?.closest('.info-card'), spots=document.getElementById('dSpots')?.closest('.info-card'), food=document.getElementById('dFood')?.closest('.info-card');if(main&&spots&&budget)main.insertBefore(spots,budget);if(main&&food&&budget)main.insertBefore(food,budget);}
window.openDetail=function(n){previousScroll=window.scrollY;document.body.classList.add('detail-mode');let c=(findByName&&findByName(n))||cities.find(x=>x.name===n);if(!c)return;currentCity=c;document.getElementById('homeWrap').style.display='none';document.getElementById('detail').style.display='block';document.getElementById('dName').textContent='';document.getElementById('dHero').innerHTML=`<div class="scene"><img class="city-photo" src="${photoUrl(c,c.name+' skyline landmark')}" alt="${E(c.name)}"></div>`;document.getElementById('dIntro').textContent=cityIntro(c);let hs=[...(c.highlights||[])];while(hs.length<6)hs.push(['城市地标','特色街区','本地市场','观景路线','博物馆','夜景街区'][hs.length]);document.getElementById('dSpots').innerHTML=hs.slice(0,6).map(h=>spotCard(c,h)).join('');let foods=[...new Set((c.food||'本地小吃、特色正餐、夜市美食').split('、').concat(['老字号餐馆','特色早餐','季节限定小吃']))];document.getElementById('dFood').innerHTML=foods.map(x=>`<span>${E(x)}</span>`).join('');let d=daysOf(c);document.getElementById('dBudget').innerHTML=planHtml(c,'eco','方案一：经济实用玩法',Math.max(2,d-1))+planHtml(c,'comfort','方案二：舒适均衡玩法',d)+planHtml(c,'deep','方案三：深度体验玩法',d+1);document.getElementById('dTransport').textContent=`先根据${hs.slice(0,3).join('、')}确定主要活动圈，再把住宿放在这些区域之间。白天用公共交通顺路串联，夜间只做短距离移动，避免来回跨城折返。`;document.getElementById('dStay').textContent=`住宿先看路线，而不是先看酒店：预算低选交通节点，舒适游选核心区外一到两站，深度游可选更有地方感的街区或景观住宿。`;reorderSections();if(window.renderComments)renderComments('hot');let f=document.querySelector('.ai-float');if(f){document.body.appendChild(f);f.style.display='block';f.innerHTML='<div class="ghost">AI助手帮助您制定您的计划</div><b>点我生成路线</b>'; }window.scrollTo({top:0,behavior:'instant'});};
window.backToList=function(){document.body.classList.remove('detail-mode');let f=document.querySelector('.ai-float');if(f)f.style.display='none';document.getElementById('detail').style.display='none';document.getElementById('homeWrap').style.display='grid';window.scrollTo({top:previousScroll||0,behavior:'instant'});};
const oldGo=window.goHome;window.goHome=function(){if(document.getElementById('detail')?.style.display==='block')return backToList();return oldGo&&oldGo();};
function groupByLetter(arr){let g={};arr.forEach(c=>{let p=String(c.pinyin||'z');let k=/^[a-z]/i.test(p)?p[0].toUpperCase():'Z';(g[k]||(g[k]=[])).push(c);});return g;}
window.renderPicker=function(q=''){q=(q||'').trim().toLowerCase();let arr=[...new Map(cities.map(c=>[c.name,c])).values()].filter(c=>!q||c.name.includes(q)||String(c.province||'').includes(q)||String(c.pinyin||'').toLowerCase().includes(q));let list=arr.filter(c=>pickerRegion==='abroad'?c.region==='abroad':c.region!=='abroad');let g=groupByLetter(list);let html=`<div class="picker-tabbar"><button class="${pickerRegion==='domestic'?'active':''}" onclick="window.__switchPickerRegion('domestic')">国内</button><button class="${pickerRegion==='abroad'?'active':''}" onclick="window.__switchPickerRegion('abroad')">国外</button></div>`;html+=Object.keys(g).sort().map(k=>`<div class="letter">${k}</div><div class="city-pills">${g[k].sort((a,b)=>String(a.pinyin).localeCompare(String(b.pinyin))).map(c=>`<button class="city-pill" onclick="chooseCity('${E(c.name)}')">${E(c.name)}</button>`).join('')}</div>`).join('');document.getElementById('pickerBody').innerHTML=html||'<div class="empty">该城市不存在，当前数据库暂未收录。</div>';};

const poetic={哈尔滨:'哈尔滨的冬天有一种童话感：中央大街的石板路被灯光照亮，松花江吹来冷风，冰雪大世界像一座会发光的城。它不是只适合看雪，而是把欧式街景、东北餐桌和冰雪浪漫放在同一段旅程里。',上海:'上海的好看，不只在外滩一排灯。武康路的梧桐、弄堂里的烟火、黄浦江边的风和咖啡馆里的细碎日常，让这座城市既有锋利的现代感，也有慢慢走才看见的温柔。',成都:'成都最动人的地方，是它把日子过得很有香气。清晨去看熊猫，午后坐进茶馆，夜里让火锅的红油把一天收住；它不催人赶路，只让人愿意多停一会儿。',重庆:'重庆像一座立体的山城剧场，楼梯、轻轨、江风和火锅热气层层叠在一起。白天在坡坎间穿行，夜里看两江灯火升起，城市的热烈会扑面而来。',厦门:'厦门的迷人，是海风把日子吹得柔软。鼓浪屿的旧楼、沙坡尾的港口、环岛路的傍晚和一碗沙茶面的热气，让它很适合把周末过成一段带海味的慢旅行。',北京:'北京的厚重不需要刻意解释，宫墙、胡同、博物馆和四季分明的树影已经写在城市里。它适合慢慢看：一边看历史，一边看今天的人怎样生活在历史旁边。',广州:'广州像一锅慢火煲出的老汤，早茶、骑楼、榕树和珠江夜色都有耐心。它不是靠宏大的景点打动人，而是用一碗云吞面、一杯热茶和老街的人声留住人。',东京:'东京的魅力在于反差：寺院的安静、电车的秩序、街巷的精致和夜晚霓虹的热闹同时存在。它适合把时间交给街区，在细节里发现城市的高级感。',西安:'西安像一本摊开的古书，城墙、秦俑、钟鼓楼和夜色中的灯火都带着时间的重量。它适合认真走一遍，也适合在一碗面里感受古都的烟火。',桂林:'桂林的山水不是背景，而是旅程本身。漓江从峰林之间慢慢流过，阳朔把烟火气藏在山脚下，适合少一点匆忙，多一点停留。'};
window.cityIntro=function(c){if(poetic[c.name])return poetic[c.name];let tags=(c.tags||[]).join('');if(c.region==='abroad')return `${c.name}的魅力不只在地标，而在街角的餐馆、黄昏的灯光和陌生语言包围下的日常。它适合把路线放松一点，在博物馆、市场、河岸或老街之间慢慢感受异国城市的节奏。`;if(tags.includes('海边'))return `${c.name}最动人的时刻常常在风里：海面、老街、夜市和一顿热乎的本地饭，把短途旅行变得轻松又有记忆点。这里适合看海，也适合把城市生活慢慢走出来。`;if(tags.includes('雪景'))return `${c.name}的美带着清冷的光，雪、街灯、热气腾腾的餐桌和北方城市的爽朗气质交织在一起。它适合冬天来，也适合用几天时间感受不一样的季节感。`;if(tags.includes('古城')||tags.includes('文化'))return `${c.name}不是只靠景点取胜的城市。老街、城墙、寺庙或博物馆把时间留在街巷里，本地小吃又把旅程拉回热闹生活，适合边走边读一座城。`;return `${c.name}适合轻松地逛、认真地吃、慢慢地停留。它的吸引力藏在街巷的声音、餐桌的味道和夜色亮起的瞬间，不必赶路，也能玩出自己的节奏。`;};

ill="#fff" opacity=".75"/>`).join(''):'';let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${g[0]}"/><stop offset=".6" stop-color="${g[1]}"/><stop offset="1" stop-color="#080b12"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="16"/></filter></defs><rect width="1200" height="800" fill="url(#g)"/><circle cx="945" cy="140" r="78" fill="${g[2]}" opacity=".92"/><circle cx="945" cy="140" r="125" fill="${g[2]}" opacity=".18" filter="url(#b)"/>${snowdots}${hills}${old}${city}${waves}<path d="M0 620 C240 570 450 655 690 610 S1000 565 1200 625 L1200 800 H0Z" fill="#060912" opacity=".72"/><text x="600" y="700" text-anchor="middle" font-size="42" fill="#f4dd83" opacity=".75" font-family="serif">${E(spot||c.name)}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);}

function budgetTotal(c,lv,d){let abroad=c.region==='abroad';let transport=abroad?(lv==='eco'?2600:lv==='comfort'?3600:5200):(lv==='eco'?500:lv==='comfort'?900:1500);let hotel=(abroad?(lv==='eco'?420:lv==='comfort'?750:1200):(lv==='eco'?180:lv==='comfort'?380:650))*Math.max(1,d-1);let food=(lv==='eco'?130:lv==='comfort'?230:420)*d;let local=(abroad?(lv==='eco'?65:140):(lv==='eco'?25:70))*d;let ticket=(lv==='eco'?160:lv==='comfort'?320:650);if(c.name==='哈尔滨')ticket=lv==='eco'?350:lv==='comfort'?500:800;return Math.round((transport+hotel+food+local+ticket+500)/100)*100;}

function planHtml(c,lv,title,d){let h=[...(c.highlights||[])];while(h.length<6)h.push(['城市地标','特色街区','本地市场','观景路线','博物馆','夜景街区'][h.length]);let food=(c.food||'本地小吃、特色正餐、夜市美食').split('、');let stay=lv==='eco'?'交通节点附近经济酒店/民宿，约¥180-320/晚':lv==='comfort'?'主要游玩圈外一到两站舒适酒店，约¥350-550/晚':'景观酒店或特色民宿，约¥650-1000/晚';let t=budgetTotal(c,lv,d), trans=localTraffic(c,lv);let cityNote=c.name==='哈尔滨'?`<p><b>实际提醒：</b>中央大街免费开放；夜市不收门票；冰雪大世界单独计门票，冬季价格波动较大，页面按约¥328估算；锅包肉按普通餐馆人均¥55-90估算。</p>`:'';let day1=`<div class="day-plan"><h4>第 1 天：抵达后先进入${E(c.name)}的核心氛围</h4><p><b>上午：</b>抵达后入住${stay}，把行李放下，再去${E(h[0])}，${ticketText(h[0])}。</p><p><b>中午：</b>在${E(h[0])}附近吃${E(food[0]||'当地小吃')}，${meal(c,lv)}。</p><p><b>下午：</b>顺路到${E(h[1])}，${ticketText(h[1])}，交通选择${trans}。</p><p><b>晚上：</b>回到住宿圈或${E(h[2])}附近吃${E(food[1]||'特色正餐')}，${meal(c,lv,c.name==='哈尔滨'?'锅包肉':'normal')}；若是夜市/步行街，以餐饮消费为主，不额外写门票。</p></div>`;let day2=`<div class="day-plan"><h4>第 2 天：从住宿位置向附近景点展开</h4><p><b>上午：</b>从酒店出发去${E(h[3])}，优先选离住宿近的一组景点，避免跨区折返，${ticketText(h[3])}。</p><p><b>中午：</b>在附近吃${E(food[2]||food[0]||'本地菜')}，${meal(c,lv)}。</p><p><b>下午：</b>继续到${E(h[4])}，${ticketText(h[4])}，市内交通按${trans}估算。</p><p><b>晚上：</b>回住宿附近吃简餐或老字号，${meal(c,lv)}，不再安排远距离移动。</p></div>`;let day3=`<div class="day-plan"><h4>第 3 天：补充体验与返程</h4><p><b>上午：</b>安排${E(h[5])}或周边街区，${ticketText(h[5])}。</p><p><b>中午：</b>吃一顿${E(food[3]||food[0]||'当地特色')}，${meal(c,lv)}。</p><p><b>下午：</b>前往车站/机场或补买伴手礼，预留交通与弹性消费。</p></div>`;return `<div class="budget-strategy"><h3>${title}</h3><div class="meta">建议${d}天 · 约 ¥${t} 起 · 已把往返交通、住宿、餐饮、门票/体验、市内交通和弹性消费分开估算。</div>${cityNote}${day1}${day2}${d>=3?day3:''}</div>`;}

nstant'});};

厦门:'厦门的海风很轻，鼓浪屿的琴声、沙坡尾的旧墙和环岛路的落日把日子擦得柔软。它适合把脚步放慢，让海浪、街角咖啡和南方树影替你安排一段温柔假期。',
北京:'北京的厚重不是摆在远处的古迹，而是清晨宫墙上的光、胡同口的烟火和中轴线上舒展开的时间。走进它，像翻开一部仍在呼吸的历史。',
上海:'上海有外滩的灯，也有武康路的树影、弄堂里的生活和咖啡馆边的细碎日常。它精致却不单薄，适合用一天看繁华，用一天看风格。',
哈尔滨:'哈尔滨的浪漫带着北方的清冽：中央大街的面包香、松花江边的风、冰雪世界的灯，把冬天写得明亮又热烈。即使只是慢慢走，也能走进一座城市的童话感。',
贵阳:'贵阳的美不张扬，藏在湿润的山风、酸汤的热气和街巷夜色里。它适合轻松地逛、认真地吃，在不赶路的节奏中尝到西南城市鲜活的脾气。',
桂林:'桂林像一幅会流动的水墨，山峰从江面慢慢站起，竹筏划过时连风都变得安静。这里适合把行程交给山水，让每一次回头都有画面。',
西安:'西安把盛唐的光、城墙的影和市井的香气放在同一条街上。白天看历史的骨骼，夜晚听人潮与鼓声，它的古意不是陈旧，而是有温度地活着。',
广州:'广州的魅力在晨早茶楼的蒸汽里，也在骑楼阴影和珠江夜色之间。它不急着表现自己，却能用一笼点心、一条老街和一句粤语把人留下。',
杭州:'杭州的美像一层薄雾，落在西湖水面、灵隐钟声和茶山绿意之间。它不需要浓烈表达，只要绕湖走一段，江南的清雅就会慢慢显出来。',
苏州:'苏州的风雅藏在园林漏窗、平江路水声和一碗苏式面里。它不是热闹的城市，而是需要放轻脚步，才会听见小桥流水里的细腻。',
东京:'东京把秩序和霓虹放在同一座城市里：清晨的神社安静，傍晚的涩谷明亮，深夜的拉面店有人间烟火。它适合一次次转角，遇见完全不同的表情。',
巴黎:'巴黎不是只属于铁塔和博物馆，它更在塞纳河边的风、街角咖啡的香和黄昏石墙上的光里。它让人慢下来，也让普通散步变得像电影。'};
function themeIntro(c){if(prose[c.name])return prose[c.name];let n=c.name,p=c.province||'';if(c.region==='abroad')return `${n}的吸引力不只在地标，而在街角光影、市场声响和陌生语言包围出的新鲜感里。白天把老城和博物馆慢慢串起，夜晚留给餐桌、河岸和灯火，旅行的层次会自然打开。`;if(/海南|三亚|海|岛|珠海|舟山|厦门|青岛/.test(n+p))return `${n}的风从水边来，带着潮湿、明亮和放松的气息。沿海岸慢慢走，白天看浪与天光，傍晚等一场落日，城市的温柔会比行程表更先抵达。`;if(/云南|贵州|广西|桂林|大理|丽江|黄山|张家界|林芝|阿坝|甘孜/.test(n+p))return `${n}的美带着山水的呼吸，云影、河谷和街巷把节奏放得很慢。它适合把时间留给路上，在转弯处看见山，在饭桌上尝到地方的鲜活。`;if(/北京|西安|南京|洛阳|开封|大同|平遥|扬州|泉州|绍兴/.test(n+p))return `${n}的底色是时间，旧街、城墙、寺院和市井烟火把历史从书页里拉回眼前。这里适合慢慢走，越靠近生活，越能看见古城真正动人的地方。`;return `${n}适合把脚步交给街巷：早晨从本地早餐开始，午后逛进市场和老街，夜里再看灯火亮起。它的好不靠相似标签堆叠，而在一段段真实生活里慢慢显出味道。`;}
window.cityIntro=themeIntro;
function sceneHtml(c,spot){let bg=img(c,spot);let fs=(c.highlights||[]).slice(0,3).map(x=>`<span>${E(x)}</span>`).join('');return `<div class="scene"><div class="photo-scene" style="background-image:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.64)),url('${bg}')"></div><div class="cityname">${E(c.name)}</div><div class="sub">${E((c.en||c.pinyin||'TRAVEL').toUpperCase())}</div><div class="feature-line">${fs}</div></div>`;}
window.scene=function(c){return sceneHtml(c,c.name)};
function spotCard2(c,h){return `<article class="card"><div class="scene"><div class="photo-scene" style="background-image:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.72)),url('${img(c,h)}')"></div><div class="spot-title">${E(h)}</div></div></article>`;}
const free=/中央大街|索菲亚教堂|防洪纪念塔|夜市|老街|步行街|公园|外滩|武康路|沙坡尾|环岛路|江滩|五一广场|宽窄巷子|春熙路|解放碑|洪崖洞|李子坝|山城步道|夫子庙|东关街|西街|北京路|沙面|珠江|海滩|湖|路|街|广场|步道|观景路线|特色街区|本地市场/;
const price={冰雪大世界:328,故宫:60,兵马俑:120,武侯祠:50,杜甫草堂:50,熊猫基地:55,黄鹤楼:70,东方明珠:199,迪士尼:475,鼓浪屿:35,蜈支洲岛:140,漓江:210,遇龙河:160,拙政园:80,灵隐寺:75,瘦西湖:100,栈桥:0,八大关:0};
function ticket(s){for(const k in price)if(String(s).includes(k))return price[k]===0?'免费开放':`门票约¥${price[k]}`;return free.test(String(s))?'免费开放':'门票/体验约¥30-100';}
function foodCost(c,lv){if(c.name==='贵阳')return lv==='eco'?'小吃/粉面人均¥18-35':'特色正餐人均¥45-75';if(c.name==='哈尔滨')return lv==='eco'?'红肠/简餐人均¥25-45':'锅包肉/东北菜人均¥45-75';return lv==='eco'?'本地小吃人均¥25-45':lv==='comfort'?'特色正餐人均¥55-90':'品质餐厅人均¥110-180';}
function traffic(c,lv){if(c.region==='abroad')return lv==='eco'?'公交/地铁单日约¥35-70':'地铁为主、短程打车，单日约¥80-150';return lv==='eco'?'地铁/公交单日约¥8-18':'地铁为主、短程打车，单日约¥25-60';}
function total(c,lv,d){let abroad=c.region==='abroad', rt=abroad?(lv==='eco'?2600:lv==='comfort'?3800:5600):(lv==='eco'?350:lv==='comfort'?750:1300);let hotel=(abroad?(lv==='eco'?360:lv==='comfort'?650:1100):(lv==='eco'?150:lv==='comfort'?300:550))*Math.max(1,d-1);let food=(lv==='eco'?95:lv==='comfort'?180:330)*d;let loc=(abroad?(lv==='eco'?65:130):(lv==='eco'?18:55))*d;let tk=lv==='eco'?120:lv==='comfort'?260:520;if(c.name==='哈尔滨')tk=lv==='eco'?328:lv==='comfort'?420:620;return Math.round((rt+hotel+food+loc+tk+300)/100)*100;}
window.tripBudget=function(c,d=3){return total(c,'comfort',d||3)};
window.planHtml=function(c,lv,title,d){let h=[...(c.highlights||[])];while(h.length<6)h.push(['城市地标','特色街区','本地市场','观景路线','博物馆','夜景街区'][h.length]);let f=(c.food||'本地小吃、特色正餐、夜市美食').split('、');let stay=lv==='eco'?'住交通节点或核心区外经济酒店，约¥150-260/晚':lv==='comfort'?'住主要游玩圈外一到两站，约¥280-450/晚':'住景观酒店/特色民宿，约¥520-900/晚';let note=c.name==='哈尔滨'?'<p><b>实际提醒：</b>中央大街和夜市免费，冰雪大世界单独按门票估算；锅包肉按普通餐馆人均¥45-75，不把同一道菜硬抬高。</p>':'';let one=`<div class="day-plan"><h4>第 1 天：先进入核心片区</h4><p><b>上午：</b>入住${stay}，去${E(h[0])}，${ticket(h[0])}。</p><p><b>中午：</b>附近吃${E(f[0]||'本地小吃')}，${foodCost(c,lv)}。</p><p><b>下午：</b>顺路到${E(h[1])}，${ticket(h[1])}，交通按${traffic(c,lv)}估算。</p><p><b>晚上：</b>在住宿附近吃${E(f[1]||'特色正餐')}；夜市/步行街不写门票，只算吃喝。</p></div>`;let two=`<div class="day-plan"><h4>第 2 天：从住宿圈向附近展开</h4><p><b>上午：</b>去离住宿更近的${E(h[2])}或${E(h[3])}，减少跨区折返，${ticket(h[2])}。</p><p><b>中午：</b>吃${E(f[2]||f[0]||'本地菜')}，${foodCost(c,lv)}。</p><p><b>下午：</b>补${E(h[4])}，${ticket(h[4])}；如果距离远，只安排一次打车，不整天打车。</p><p><b>晚上：</b>回住宿附近吃简餐/老字号，控制在同一片区。</p></div>`;let three=`<div class="day-plan"><h4>第 3 天：升级体验，不是把同样的饭吃更贵</h4><p><b>上午：</b>加入${E(h[5])}或博物馆/观景体验。</p><p><b>中午：</b>${lv==='deep'?'选择环境更好的地方菜或预约餐厅':'选择口碑小店'}，费用差异来自体验和环境，不是同一道小吃翻倍。</p><p><b>下午：</b>预留返程、伴手礼和弹性交通。</p></div>`;return `<div class="budget-strategy"><h3>${title}</h3><div class="meta">建议${d}天 · 约 ¥${total(c,lv,d)} 起 · 预算差异来自住宿位置、交通方式、收费体验和用餐环境，而不是把同一个项目乱涨价。</div>${note}${one}${two}${d>=3?three:''}</div>`;};
window.renderCards=function(list){let d=Number(document.getElementById('daysInput')?.value)||3;let el=document.getElementById('cityGrid');el.innerHTML=list.length?list.map((c,i)=>{let label=mode==='home'?`本月 TOP ${c.monthRank||i+1}`:mode==='distance'?`距离第 ${i+1} 名`:`筛选第 ${i+1} 名`;let dist=mode==='distance'?`<span>约 ${c.distance} km</span>`:'';return `<article class="card" onclick="openDetail('${E(c.name)}')">${sceneHtml(c,c.name)}<div class="distanceBox"><span>约${d}天 ¥${tripBudget(c,d)}起</span>${dist}</div><div class="badges"><span class="badge gold">${E(label)}</span><span class="badge">⭐ ${E(c.score)}</span></div><div class="card-desc">${E(themeIntro(c).slice(0,62))}。</div></article>`}).join(''):`<div class="empty">没有符合当前条件的城市。</div>`;};
const oldOpen=window.openDetail;window.openDetail=function(n){oldOpen(n);let c=currentCity;if(!c)return;document.getElementById('dHero').innerHTML=sceneHtml(c,c.name);document.getElementById('dIntro').textContent=themeIntro(c);let hs=[...(c.highlights||[])];while(hs.length<6)hs.push(['城市地标','特色街区','本地市场','观景路线','博物馆','夜景街区'][hs.length]);document.getElementById('dSpots').innerHTML=hs.slice(0,6).map(h=>spotCard2(c,h)).join('');document.getElementById('dBudget').innerHTML=planHtml(c,'eco','方案一：经济实用玩法',2)+planHtml(c,'comfort','方案二：舒适均衡玩法',3)+planHtml(c,'deep','方案三：深度体验玩法',4);let f=document.querySelector('.ai-float');if(f){f.style.left='auto';f.style.top='auto';f.style.right='28px';f.style.bottom='92px';f.innerHTML='<div><div class="ghost">AI助手帮你制定计划</div><b>点我生成路线</b></div>';}}
window.openAI=function(){let c=currentCity||cities[0];let modal=document.getElementById('aiModal');modal.innerHTML=`<div class="chatbox" onclick="event.stopPropagation()"><button class="ai-close secondary" onclick="closeAI()">关闭 ×</button><h2>AI 攻略助手 · ${E(c.name)}</h2><div class="ai-chat-window"><div class="ai-msg bot">我会按你的预算、天数和偏好，把住宿圈、附近景点、餐饮、门票和交通拆开计算，避免绕路和乱报价。</div></div><div class="ai-row"><input id="aiKeyword" placeholder="例如：亲子 / 少走路 / 美食 / 拍照"><select id="aiDays"><option>2天</option><option selected>3天</option><option>4天</option><option>5天</option></select><button class="primary ai-send" onclick="makeAIPlan()">生成</button></div><input id="aiBudget" type="number" value="${tripBudget(c,3)}" placeholder="总预算" style="margin-top:10px;height:48px;width:100%"></div>`;modal.onclick=closeAI;modal.classList.add('show');};
if(document.getElementById('homeWrap')?.style.display!=='none' && typeof monthly==='function')showList('本月热门城市排行榜',monthly(),'本月 TOP 1');
})();
</script>

</body></html>
